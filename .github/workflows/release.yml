name: Release
# 任意 v* tag 都会构建全平台构件（测试用的 APK/安装包在该次 Actions 运行页可下载）；
# 只有 vx.y.0（patch=0）的 tag 才会正式发布 GitHub Release（见 release job 的 if）。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            args: "--target aarch64-apple-darwin"
            bundle-dir: src-tauri/target/aarch64-apple-darwin/release/bundle
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macos-x64
            args: "--target x86_64-apple-darwin"
            bundle-dir: src-tauri/target/x86_64-apple-darwin/release/bundle
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            args: ""
            bundle-dir: src-tauri/target/release/bundle
          # 特意用 22.04：AppImage 的发行版兼容下限由打包机 glibc 决定，
          # 24.04 打出的包跑不动 20.04/22.04 等老发行版
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            args: ""
            bundle-dir: src-tauri/target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Configure macOS signing (可选:配置了 Apple secrets 才注入)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -u
          [ -n "$APPLE_CERTIFICATE" ] && echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV" || true
          [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV" || true
          [ -n "$APPLE_SIGNING_IDENTITY" ] && echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV" || true
          [ -n "$APPLE_ID" ] && echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV" || true
          [ -n "$APPLE_PASSWORD" ] && echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV" || true
          [ -n "$APPLE_TEAM_ID" ] && echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV" || true

      - name: Install Linux build deps (Tauri v2 前置:WebKitGTK / appindicator 等)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Build desktop bundles
        run: pnpm tauri build ${{ matrix.args }}

      # Windows 便携版：Tauri 前端资源内嵌进 exe，裸 exe 即绿色版；
      # 预置 .portable 标记（paths.rs 检测）让数据写在 exe 旁 data/ 而非 AppData。
      # zip 放进 bundle 目录，随下方 artifact 上传一步带出。
      - name: Package portable build (Windows)
        if: matrix.label == 'windows-x64'
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/TodoLite.exe"
          if (!(Test-Path $exe)) { $exe = "src-tauri/target/release/todolite.exe" }
          if (!(Test-Path $exe)) { throw "portable: 未找到 release exe" }
          $stage = "src-tauri/target/release/bundle/portable/TodoLite"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item $exe "$stage/TodoLite.exe"
          New-Item -ItemType File "$stage/.portable" | Out-Null
          @'
          TodoLite 便携版（portable）
          - 解压到任意目录后运行 TodoLite.exe（需系统已装 WebView2，Win10 1803+/Win11 自带）
          - 数据保存在本目录的 data 文件夹内，随程序一起移动；删除 data 即完全重置
          - .portable 是便携模式标记文件，请勿删除（删掉后退回系统 AppData 存数据）
          - 与安装版共用单实例锁：两者同时只会运行先启动的那个
          - WebDAV 密码存于 Windows 凭据管理器（跟随系统账户，不随 data 目录移动）
          '@ | Out-File -Encoding utf8 "$stage/README.txt"
          Compress-Archive -Path $stage `
            -DestinationPath "src-tauri/target/release/bundle/portable/TodoLite-windows-x64-portable.zip" `
            -Force
          Remove-Item -Recurse -Force $stage

      - name: Run frontend tests
        run: pnpm test

      - uses: actions/upload-artifact@v4
        with:
          name: todolite-${{ matrix.label }}
          path: ${{ matrix.bundle-dir }}
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      # 发布签名(兼容式更新关键):同一把密钥签出的包才能互相覆盖安装。
      # 首次配置见 docs/compatible-updates.md「生成并托管签名密钥」。
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/todolite-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27b
          add-to-path: false

      - name: Ensure Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
            mkdir -p "$HOME/android-sdk/cmdline-tools"
            # ubuntu runner 自带 SDK；此分支仅为自托管兜底
          fi

      - name: Ensure Android project
        run: test -d src-tauri/gen/android || pnpm tauri android init

      - name: Verify tag matches app version
        # versionCode 由 semver 推导(tag 版本 < 当前版本会让老用户无法覆盖安装)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::tag (v$TAG_VERSION) 与 tauri.conf.json 版本 ($APP_VERSION) 不一致；发版前请先递增 version 再打 tag"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Restore release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"

      - name: Build signed release APK (arm64，可直接覆盖安装旧版本)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android build --apk --target aarch64

      - name: Build debug APK (arm64，未配置签名密钥时的兜底，不能覆盖安装)
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: pnpm tauri android build --apk --debug --target aarch64

      - name: Remove keystore
        if: always() && env.ANDROID_KEYSTORE_BASE64 != ''
        run: rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: todolite-android-arm64
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    # 只有 vx.y.0 才正式发布 Release；其余 v* tag 是补丁/测试，仅保留构建构件。
    # （GitHub Actions 表达式没有正则函数，用 startsWith+endsWith 组合：
    #   v0.5.0 ✓ / v0.4.7 ✗ / v0.4.10 ✗ / v1.2.30 ✗）
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref, '.0')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-files

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/**/*.dmg
            release-files/**/*.exe
            release-files/**/*.msi
            release-files/**/*.apk
            release-files/**/*.AppImage
            release-files/**/*.deb
            release-files/**/*.rpm
          generate_release_notes: true
